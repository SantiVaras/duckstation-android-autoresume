name: Android arm64 Auto Resume

on:
  push:
    branches: [android-autoresume]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install historical Android toolchain
        run: sdkmanager 'platforms;android-29' 'build-tools;30.0.2' 'ndk;21.4.7075529' 'cmake;3.22.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Test launch options and build unsigned APK
        working-directory: android
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 testReleaseUnitTest assembleRelease
      - name: Verify package and architecture
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/duckstation-autoresume-arm64-unsigned.apk
          "$ANDROID_HOME/build-tools/30.0.2/aapt" dump badging artifacts/*.apk | tee artifacts/package.txt
          grep -q "package: name='com.github.santivaras.duckstation.autoresume'" artifacts/package.txt
          grep -q "native-code: 'arm64-v8a'" artifacts/package.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('artifacts/duckstation-autoresume-arm64-unsigned.apk') as apk:
              libs = [name for name in apk.namelist() if name.startswith('lib/') and name.endswith('.so')]
              assert libs and all(name.startswith('lib/arm64-v8a/') for name in libs), libs
              assert 'lib/arm64-v8a/libduckstation-native.so' in libs, libs
          PY
          git rev-parse HEAD > artifacts/source-commit.txt
          git archive --format=tar.gz HEAD > artifacts/corresponding-source.tar.gz
          cp LICENSE README-AUTORESUME.md artifacts/
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: duckstation-autoresume-arm64-unsigned
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-option-test-results
          path: android/app/build/test-results/
